<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip 7">
  <meta name="theme-color" content="#000000">
  <title>Flip 7 Scoreboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #1c1c1e;
      color: #8e8e93;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active { background: #2c2c2e; }
    .icon-btn svg {
      width: 20px; height: 20px;
      stroke: currentColor; fill: none; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .board {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(96px, 34%) 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 6px 4px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      width: 100%;
    }

    .row:active { background: rgba(255,255,255,0.06); }
    .row.selected { background: rgba(255,255,255,0.08); }

    .row-name {
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 600;
      line-height: 1.2;
      word-break: break-word;
    }

    .bar-track {
      height: 22px;
      background: #1c1c1e;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: 6px;
      width: 0;
      min-width: 0;
      transition: width 0.25s ease;
    }

    .row-score {
      font-size: clamp(20px, 5.5vw, 28px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      min-width: 2.4em;
      text-align: right;
      -webkit-text-stroke: 1px currentColor;
      paint-order: stroke fill;
    }

    .hint {
      flex-shrink: 0;
      text-align: center;
      color: #636366;
      font-size: 13px;
      padding: 4px 16px 14px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
      padding: 0 0 env(safe-area-inset-bottom);
    }

    .overlay.open { display: flex; }
    .overlay.center { align-items: center; }

    .pad {
      width: 100%;
      max-width: 420px;
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      padding: 16px 16px 20px;
    }

    .pad-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .pad-title { font-size: 15px; font-weight: 600; }

    .pad-cancel {
      border: none;
      background: transparent;
      color: #8e8e93;
      font-size: 15px;
      font-weight: 600;
      padding: 8px;
      cursor: pointer;
    }

    .pad-display {
      text-align: center;
      font-size: 48px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      min-height: 56px;
      margin-bottom: 12px;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .pad-key {
      height: 56px;
      border-radius: 14px;
      border: none;
      background: #2c2c2e;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .pad-key:active { background: #3a3a3c; transform: scale(0.97); }
    .pad-key.action { background: #3a3a3c; font-size: 18px; }
    .pad-key.add { background: #34c759; color: #000; grid-column: span 2; }
    .pad-key.sub { background: #ff453a; color: #fff; }

    .dialog {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 24px;
      max-width: 300px;
      width: calc(100% - 48px);
      margin: auto;
      text-align: center;
    }

    .dialog h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .dialog p { font-size: 14px; color: #8e8e93; margin-bottom: 20px; line-height: 1.4; }
    .dialog-btns { display: flex; gap: 12px; }
    .dialog-btns button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .dialog-cancel { background: #3a3a3c; color: #fff; }
    .dialog-confirm { background: #ff453a; color: #fff; }
  </style>
</head>
<body>
  <header class="header">
    <button class="icon-btn" id="listBtn" aria-label="Close pad" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main class="board" id="board"></main>
  <div class="hint">Tap a player · type the points</div>

  <div class="overlay" id="padOverlay">
    <div class="pad" role="dialog" aria-modal="true">
      <div class="pad-head">
        <div class="pad-title" id="padTitle">Add points</div>
        <button class="pad-cancel" id="padCancel" type="button">Cancel</button>
      </div>
      <div class="pad-display" id="padDisplay">0</div>
      <div class="pad-grid" id="padGrid"></div>
    </div>
  </div>

  <div class="overlay center" id="resetOverlay">
    <div class="dialog">
      <h2>Reset scores?</h2>
      <p>Back to the starting scores. Order stays the same.</p>
      <div class="dialog-btns">
        <button class="dialog-cancel" id="resetCancel" type="button">Cancel</button>
        <button class="dialog-confirm" id="resetConfirm" type="button">Reset</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'flip7_scores_v3';

    const PLAYERS = [
      { name: 'Bonk (D-LAW)',       color: '#39FF14', score: 70 },
      { name: 'burgdawg (JAY)',     color: '#FF9500', score: 0  },
      { name: 'Scooby (BECCA)',     color: '#FF3B30', score: 32 },
      { name: 'Dimbo (KA)',         color: '#5AC8FA', score: 36 },
      { name: 'Ding Dong (JBRUH)',  color: '#FFCC00', score: 63 },
      { name: 'buckle (KISSA)',     color: '#FF2D92', score: 0  },
      { name: 'shack (CHAY)',       color: '#30D158', score: 36 },
      { name: 'bean shack (JACOB)', color: '#BF5AF2', score: 0  },
      { name: 'Big dog (TOBY)',     color: '#FF6482', score: 85 },
      { name: 'flush (TREY)',       color: '#5856D6', score: 21 },
    ];

    const DEFAULT_SCORES = PLAYERS.map(p => p.score);

    let scores = [...DEFAULT_SCORES];
    let selectedIndex = null;
    let padValue = '';

    function loadScores() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.scores) && data.scores.length === PLAYERS.length) {
          scores = data.scores.map(n => (typeof n === 'number' && !isNaN(n) ? n : 0));
        }
      } catch (_) {}
    }

    function saveScores() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ scores }));
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function openPad(index) {
      selectedIndex = index;
      padValue = '';
      const p = PLAYERS[index];
      document.getElementById('padTitle').innerHTML =
        '<span style="color:' + p.color + '">' + escapeHtml(p.name) + '</span>';
      document.getElementById('padDisplay').style.color = p.color;
      updatePadDisplay();
      document.getElementById('padOverlay').classList.add('open');
      render();
    }

    function closePad() {
      document.getElementById('padOverlay').classList.remove('open');
      selectedIndex = null;
      padValue = '';
      render();
    }

    function updatePadDisplay() {
      document.getElementById('padDisplay').textContent = padValue === '' ? '0' : padValue;
    }

    function applyPad(sign) {
      if (selectedIndex === null) return;
      const n = parseInt(padValue || '0', 10);
      if (!n) { closePad(); return; }
      scores[selectedIndex] = Math.max(0, scores[selectedIndex] + sign * n);
      saveScores();
      closePad();
    }

    function resetScores() {
      scores = [...DEFAULT_SCORES];
      selectedIndex = null;
      saveScores();
      render();
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const max = 200;

      PLAYERS.forEach((p, index) => {
        const pct = Math.min(100, Math.max(0, (scores[index] / max) * 100));
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'row' + (selectedIndex === index ? ' selected' : '');
        row.innerHTML =
          '<span class="row-name" style="color:' + p.color + '">' + escapeHtml(p.name) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%;background:' + p.color + '"></span></span>' +
          '<span class="row-score" style="color:' + p.color + '">' + scores[index] + '</span>';
        row.addEventListener('pointerup', (e) => { e.preventDefault(); openPad(index); });
        board.appendChild(row);
      });
    }

    function buildPad() {
      const grid = document.getElementById('padGrid');
      const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','+'];
      keys.forEach((key) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pad-key';
        if (key === '+') {
          btn.className += ' add';
          btn.textContent = 'Add';
          btn.addEventListener('pointerup', (e) => { e.preventDefault(); applyPad(1); });
        } else if (key === '⌫') {
          btn.className += ' action';
          btn.textContent = '⌫';
          btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            padValue = padValue.slice(0, -1);
            updatePadDisplay();
          });
        } else {
          btn.textContent = key;
          btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (padValue.length >= 4) return;
            if (padValue === '' && key === '0') return;
            padValue += key;
            updatePadDisplay();
          });
        }
        grid.appendChild(btn);
      });

      const sub = document.createElement('button');
      sub.type = 'button';
      sub.className = 'pad-key sub';
      sub.textContent = 'Subtract';
      sub.style.gridColumn = 'span 3';
      sub.addEventListener('pointerup', (e) => { e.preventDefault(); applyPad(-1); });
      grid.appendChild(sub);
    }

    document.getElementById('padCancel').addEventListener('pointerup', (e) => {
      e.preventDefault();
      closePad();
    });

    document.getElementById('padOverlay').addEventListener('pointerup', (e) => {
      if (e.target.id === 'padOverlay') closePad();
    });

    document.getElementById('settingsBtn').addEventListener('pointerup', (e) => {
      e.preventDefault();
      document.getElementById('resetOverlay').classList.add('open');
    });

    document.getElementById('resetCancel').addEventListener('pointerup', (e) => {
      e.preventDefault();
      document.getElementById('resetOverlay').classList.remove('open');
    });

    document.getElementById('resetConfirm').addEventListener('pointerup', (e) => {
      e.preventDefault();
      document.getElementById('resetOverlay').classList.remove('open');
      resetScores();
    });

    document.getElementById('listBtn').addEventListener('pointerup', (e) => {
      e.preventDefault();
      closePad();
    });

    buildPad();
    loadScores();
    saveScores();
    render();
  </script>
</body>
</html>
