<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip 7">
  <meta name="theme-color" content="#000000">
  <title>Flip 7 Scoreboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 12px 4px;
      flex-shrink: 0;
    }

    .header-left, .header-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #1c1c1e;
      color: #8e8e93;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:active { background: #2c2c2e; }
    .icon-btn.playing { color: #34c759; }
    .icon-btn svg {
      width: 20px; height: 20px;
      stroke: currentColor; fill: none; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .pill {
      border: none;
      background: #1c1c1e;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .pill:active { background: #2c2c2e; }
    .pill.on { background: #2c2c2e; color: #34c759; }
    .pill.recap { color: #ffcc00; }

    .lyrics {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #ffcc00;
      padding: 4px 16px 0;
      min-height: 1.2em;
      letter-spacing: 0.02em;
    }

    .board {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1.6em minmax(88px, 32%) 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      width: 100%;
    }

    .row:active { background: rgba(255,255,255,0.06); }
    .row.selected { background: rgba(255,255,255,0.08); }

    .row-rank {
      font-size: 13px;
      font-weight: 700;
      color: #8e8e93;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .row-name {
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 600;
      line-height: 1.2;
      word-break: break-word;
    }

    .bar-track {
      height: 22px;
      background: #1c1c1e;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: 6px;
      width: 0;
      transition: width 0.25s ease;
    }

    .row-score {
      font-size: clamp(20px, 5.5vw, 28px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      min-width: 2.4em;
      text-align: right;
      -webkit-text-stroke: 1px currentColor;
      paint-order: stroke fill;
    }

    .hint {
      flex-shrink: 0;
      text-align: center;
      color: #636366;
      font-size: 13px;
      padding: 4px 16px 14px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
      padding: 0 0 env(safe-area-inset-bottom);
    }

    .overlay.open { display: flex; }
    .overlay.center { align-items: center; }

    .pad {
      width: 100%;
      max-width: 420px;
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      padding: 16px 16px 20px;
    }

    .pad-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .pad-title { font-size: 15px; font-weight: 600; }

    .pad-cancel {
      border: none;
      background: transparent;
      color: #8e8e93;
      font-size: 15px;
      font-weight: 600;
      padding: 8px;
      cursor: pointer;
    }

    .pad-display {
      text-align: center;
      font-size: 48px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-height: 56px;
      margin-bottom: 12px;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .pad-key {
      height: 56px;
      border-radius: 14px;
      border: none;
      background: #2c2c2e;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .pad-key:active { background: #3a3a3c; transform: scale(0.97); }
    .pad-key.action { background: #3a3a3c; font-size: 18px; }
    .pad-key.add { background: #34c759; color: #000; grid-column: span 2; }
    .pad-key.sub { background: #ff453a; color: #fff; }

    .dialog {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 24px;
      max-width: 300px;
      width: calc(100% - 48px);
      margin: auto;
      text-align: center;
    }

    .dialog h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .dialog p { font-size: 14px; color: #8e8e93; margin-bottom: 20px; line-height: 1.4; }
    .dialog-btns { display: flex; gap: 12px; }
    .dialog-btns button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .dialog-cancel { background: #3a3a3c; color: #fff; }
    .dialog-confirm { background: #ff453a; color: #fff; }

    .recap-sheet {
      width: 100%;
      max-width: 440px;
      max-height: min(88vh, 720px);
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .recap-sheet h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ffcc00;
    }

    .recap-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-size: 14px;
      line-height: 1.45;
      color: #eee;
      white-space: pre-wrap;
      flex: 1;
      min-height: 0;
      padding-right: 4px;
    }

    .recap-body strong { color: #fff; }
    .recap-actions { display: flex; gap: 10px; }
    .recap-actions button {
      flex: 1;
      padding: 14px 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .recap-close { background: #3a3a3c; color: #fff; }
    .recap-lock { background: #34c759; color: #000; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="pill" id="sortBtn" type="button" aria-label="Toggle sort order">High score</button>
      <button class="pill recap" id="recapBtn" type="button">Recap</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="themeBtn" aria-label="Play theme song" type="button" title="Theme song">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="lyrics" id="lyrics" hidden></div>
  <main class="board" id="board"></main>
  <div class="hint" id="hint">Tap a player · type the points</div>

  <div class="overlay" id="padOverlay">
    <div class="pad" role="dialog" aria-modal="true">
      <div class="pad-head">
        <div class="pad-title" id="padTitle">Add points</div>
        <button class="pad-cancel" id="padCancel" type="button">Cancel</button>
      </div>
      <div class="pad-display" id="padDisplay">0</div>
      <div class="pad-grid" id="padGrid"></div>
    </div>
  </div>

  <div class="overlay" id="recapOverlay">
    <div class="recap-sheet" role="dialog" aria-modal="true">
      <h2 id="recapTitle">Round Recap</h2>
      <div class="recap-body" id="recapBody"></div>
      <div class="recap-actions">
        <button class="recap-close" id="recapClose" type="button">Close</button>
        <button class="recap-lock" id="recapLock" type="button">End round</button>
      </div>
    </div>
  </div>

  <div class="overlay center" id="resetOverlay">
    <div class="dialog">
      <h2>Reset scores?</h2>
      <p>Back to the starting scores. Order stays the same.</p>
      <div class="dialog-btns">
        <button class="dialog-cancel" id="resetCancel" type="button">Cancel</button>
        <button class="dialog-confirm" id="resetConfirm" type="button">Reset</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'flip7_scores_v3';
    const META_KEY = 'flip7_meta_v1';

    const PLAYERS = [
      { name: 'Bonk (D-LAW)',       color: '#39FF14', score: 70, short: 'Bonk' },
      { name: 'burgdawg (JAY)',     color: '#FF9500', score: 0,  short: 'burgdawg' },
      { name: 'Scooby (BECCA)',     color: '#FF3B30', score: 32, short: 'Scooby' },
      { name: 'Dimbo (KA)',         color: '#5AC8FA', score: 36, short: 'Dimbo' },
      { name: 'Ding Dong (JBRUH)',  color: '#FFCC00', score: 63, short: 'Ding Dong' },
      { name: 'buckle (KISSA)',     color: '#FF2D92', score: 0,  short: 'buckle' },
      { name: 'shack (CHAY)',       color: '#30D158', score: 36, short: 'shack' },
      { name: 'bean shack (JACOB)', color: '#BF5AF2', score: 0,  short: 'bean shack' },
      { name: 'Big dog (TOBY)',     color: '#FF6482', score: 85, short: 'Big dog' },
      { name: 'flush (TREY)',       color: '#5856D6', score: 21, short: 'flush' },
    ];

    const DEFAULT_SCORES = PLAYERS.map(p => p.score);

    let scores = [...DEFAULT_SCORES];
    let baseline = [...DEFAULT_SCORES];
    let zeroStreaks = PLAYERS.map(() => 0);
    let roundNumber = 1;
    let selectedIndex = null;
    let padValue = '';
    let sortByScore = false;

    function loadAll() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (Array.isArray(data.scores) && data.scores.length === PLAYERS.length) {
            scores = data.scores.map(n => (typeof n === 'number' && !isNaN(n) ? n : 0));
          }
        }
      } catch (_) {}

      try {
        const meta = JSON.parse(localStorage.getItem(META_KEY) || 'null');
        if (meta) {
          if (Array.isArray(meta.baseline) && meta.baseline.length === PLAYERS.length) {
            baseline = meta.baseline.map(n => (typeof n === 'number' && !isNaN(n) ? n : 0));
          } else {
            baseline = [...scores];
          }
          if (Array.isArray(meta.zeroStreaks) && meta.zeroStreaks.length === PLAYERS.length) {
            zeroStreaks = meta.zeroStreaks.map(n => (typeof n === 'number' ? n : 0));
          }
          if (typeof meta.roundNumber === 'number' && meta.roundNumber >= 1) {
            roundNumber = meta.roundNumber;
          }
        } else {
          baseline = [...scores];
        }
      } catch (_) {
        baseline = [...scores];
      }

      try { sortByScore = localStorage.getItem('flip7_sort_by_score') === '1'; } catch (_) {}
    }

    function saveScores() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ scores }));
    }

    function saveMeta() {
      localStorage.setItem(META_KEY, JSON.stringify({
        baseline,
        zeroStreaks,
        roundNumber,
      }));
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function deltas() {
      return scores.map((s, i) => s - baseline[i]);
    }

    function shortName(i) {
      return PLAYERS[i].short;
    }

    function colored(i, text) {
      return '<strong style="color:' + PLAYERS[i].color + '">' + escapeHtml(text) + '</strong>';
    }

    function buildRecap() {
      const d = deltas();
      const movers = d
        .map((delta, i) => ({ i, delta }))
        .filter(x => x.delta !== 0)
        .sort((a, b) => b.delta - a.delta);

      const gainers = movers.filter(x => x.delta > 0);
      const losers = movers.filter(x => x.delta < 0);
      const zerosThisRound = d.map((delta, i) => ({ i, delta })).filter(x => x.delta === 0);
      const projectedStreaks = zeroStreaks.map((z, i) => d[i] === 0 ? z + 1 : 0);
      const maxStreak = Math.max(0, ...projectedStreaks);
      const streakClub = projectedStreaks
        .map((z, i) => ({ i, z }))
        .filter(x => x.z === maxStreak && maxStreak > 0);

      const leaderIdx = scores.reduce((best, s, i) => (s > scores[best] ? i : best), 0);
      const trailerIdx = scores.reduce((worst, s, i) => (s < scores[worst] ? i : worst), 0);
      const closestTo200 = scores
        .map((s, i) => ({ i, left: 200 - s }))
        .filter(x => x.left > 0)
        .sort((a, b) => a.left - b.left)[0];

      let out = '';
      out += '🎙 Flip 7 — Round ' + roundNumber + ' Recap\n\n';

      if (gainers.length === 0 && losers.length === 0) {
        out += 'Nobody scored anything this round.\nThe cards collectively filed a complaint.\n\n';
      } else {
        out += '📈 Biggest movers\n';
        if (gainers.length) {
          gainers.slice(0, 4).forEach((g, rank) => {
            const medals = ['🥇', '🥈', '🥉', '✨'];
            out += medals[rank] + ' ' + colored(g.i, shortName(g.i)) + '  +' + g.delta + '\n';
          });
        } else {
          out += 'No positive movers. Pure tragedy.\n';
        }
        out += '\n';
      }

      if (losers.length) {
        out += '📉 Went backwards (how?)\n';
        losers.forEach(l => {
          out += '• ' + colored(l.i, shortName(l.i)) + '  ' + l.delta + '\n';
        });
        out += '\n';
      }

      out += '🥚 Zero Club (this round)\n';
      if (zerosThisRound.length === PLAYERS.length) {
        out += 'Everyone. Historic. Embarrassing.\n\n';
      } else if (zerosThisRound.length) {
        out += zerosThisRound.map(z => colored(z.i, shortName(z.i))).join(', ') + '\n\n';
      } else {
        out += 'Empty. Rare. Beautiful.\n\n';
      }

      out += '💤 Longest loser streak\n';
      if (maxStreak <= 0) {
        out += 'No active zero streaks. The drought has ended… for now.\n\n';
      } else {
        out += streakClub.map(s => colored(s.i, shortName(s.i))).join(', ');
        out += ' — ' + maxStreak + ' straight round' + (maxStreak === 1 ? '' : 's') + ' of nothing.\n\n';
      }

      out += '🏆 Funny awards\n';
      if (gainers[0]) {
        out += '• Most violent climb: ' + colored(gainers[0].i, shortName(gainers[0].i)) + ' (+' + gainers[0].delta + ')\n';
      }
      out += '• Current throne: ' + colored(leaderIdx, shortName(leaderIdx)) + ' (' + scores[leaderIdx] + ')\n';
      out += '• Basement dweller: ' + colored(trailerIdx, shortName(trailerIdx)) + ' (' + scores[trailerIdx] + ')\n';
      if (closestTo200) {
        out += '• Closest to 200: ' + colored(closestTo200.i, shortName(closestTo200.i)) + ' (' + closestTo200.left + ' to go)\n';
      }
      if (gainers[0] && gainers[0].i === leaderIdx) {
        out += '• Most rude: ' + colored(leaderIdx, shortName(leaderIdx)) + ' padded the lead\n';
      }
      const nameAward = PLAYERS.reduce((best, p, i) =>
        p.short.length > PLAYERS[best].short.length ? i : best, 0);
      out += '• Best name still: ' + colored(nameAward, shortName(nameAward)) + '\n';
      out += '• Theme song eligibility: still yes\n\n';

      out += 'Tap End round to lock this recap and start tracking the next one.';
      return out;
    }

    function openRecap() {
      document.getElementById('recapTitle').textContent = 'Round ' + roundNumber + ' Recap';
      document.getElementById('recapBody').innerHTML = buildRecap();
      document.getElementById('recapOverlay').classList.add('open');
    }

    function closeRecap() {
      document.getElementById('recapOverlay').classList.remove('open');
    }

    function endRound() {
      const d = deltas();
      zeroStreaks = zeroStreaks.map((z, i) => (d[i] === 0 ? z + 1 : 0));
      baseline = [...scores];
      roundNumber += 1;
      saveMeta();
      closeRecap();
      updateHint();
    }

    function updateHint() {
      document.getElementById('hint').textContent =
        'Round ' + roundNumber + ' · tap a player · Recap when done';
    }

    function openPad(index) {
      selectedIndex = index;
      padValue = '';
      const p = PLAYERS[index];
      document.getElementById('padTitle').innerHTML =
        '<span style="color:' + p.color + '">' + escapeHtml(p.name) + '</span>';
      document.getElementById('padDisplay').style.color = p.color;
      updatePadDisplay();
      document.getElementById('padOverlay').classList.add('open');
      render();
    }

    function closePad() {
      document.getElementById('padOverlay').classList.remove('open');
      selectedIndex = null;
      padValue = '';
      render();
    }

    function updatePadDisplay() {
      document.getElementById('padDisplay').textContent = padValue === '' ? '0' : padValue;
    }

    function applyPad(sign) {
      if (selectedIndex === null) return;
      const n = parseInt(padValue || '0', 10);
      if (!n) { closePad(); return; }
      scores[selectedIndex] = Math.max(0, scores[selectedIndex] + sign * n);
      saveScores();
      closePad();
    }

    function resetScores() {
      scores = [...DEFAULT_SCORES];
      baseline = [...DEFAULT_SCORES];
      zeroStreaks = PLAYERS.map(() => 0);
      roundNumber = 1;
      selectedIndex = null;
      saveScores();
      saveMeta();
      updateHint();
      render();
    }

    function orderedIndexes() {
      const idxs = PLAYERS.map((_, i) => i);
      if (!sortByScore) return idxs;
      return idxs.sort((a, b) => {
        if (scores[b] !== scores[a]) return scores[b] - scores[a];
        return a - b;
      });
    }

    function updateSortButton() {
      const btn = document.getElementById('sortBtn');
      if (sortByScore) {
        btn.textContent = 'Roster order';
        btn.classList.add('on');
      } else {
        btn.textContent = 'High score';
        btn.classList.remove('on');
      }
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const max = 200;
      updateSortButton();

      orderedIndexes().forEach((index, rank) => {
        const p = PLAYERS[index];
        const pct = Math.min(100, Math.max(0, (scores[index] / max) * 100));
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'row' + (selectedIndex === index ? ' selected' : '');
        row.innerHTML =
          '<span class="row-rank">' + (rank + 1) + '</span>' +
          '<span class="row-name" style="color:' + p.color + '">' + escapeHtml(p.name) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%;background:' + p.color + '"></span></span>' +
          '<span class="row-score" style="color:' + p.color + '">' + scores[index] + '</span>';
        row.addEventListener('pointerup', (e) => { e.preventDefault(); openPad(index); });
        board.appendChild(row);
      });
    }

    function buildPad() {
      const grid = document.getElementById('padGrid');
      const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','+'];
      keys.forEach((key) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pad-key';
        if (key === '+') {
          btn.className += ' add';
          btn.textContent = 'Add';
          btn.addEventListener('pointerup', (e) => { e.preventDefault(); applyPad(1); });
        } else if (key === '⌫') {
          btn.className += ' action';
          btn.textContent = '⌫';
          btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            padValue = padValue.slice(0, -1);
            updatePadDisplay();
          });
        } else {
          btn.textContent = key;
          btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (padValue.length >= 4) return;
            if (padValue === '' && key === '0') return;
            padValue += key;
            updatePadDisplay();
          });
        }
        grid.appendChild(btn);
      });

      const sub = document.createElement('button');
      sub.type = 'button';
      sub.className = 'pad-key sub';
      sub.textContent = 'Subtract';
      sub.style.gridColumn = 'span 3';
      sub.addEventListener('pointerup', (e) => { e.preventDefault(); applyPad(-1); });
      grid.appendChild(sub);
    }

    let audioCtx = null;
    let themePlaying = false;
    const THEME_LINES = [
      'Flip seven — don’t you bust!',
      'Bonk, Scooby, Dimbo, trust!',
      'Big dog leadin’, ding dong heat',
      'Two hundred wins — take a seat!'
    ];

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playNote(ctx, freq, start, dur, type, gainVal) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    }

    function playTheme() {
      if (themePlaying) return;
      const ctx = ensureAudio();
      const btn = document.getElementById('themeBtn');
      const lyrics = document.getElementById('lyrics');
      themePlaying = true;
      btn.classList.add('playing');

      const C4=261.63, D4=293.66, E4=329.63, F4=349.23, G4=392.00, A4=440.00, B4=493.88, C5=523.25, E5=659.25, G5=783.99;
      const t0 = ctx.currentTime + 0.05;
      const beat = 0.22;
      const hook = [
        [C4, 1], [E4, 1], [G4, 1], [C5, 1.5],
        [G4, 0.5], [A4, 1], [G4, 1], [E4, 1], [C4, 1.5],
        [D4, 0.5], [E4, 1], [F4, 1], [G4, 1], [A4, 1],
        [B4, 1], [C5, 2],
        [E5, 1], [C5, 1], [G5, 1], [E5, 1], [C5, 2.5],
      ];

      let t = t0;
      hook.forEach(([freq, beats]) => {
        playNote(ctx, freq, t, beats * beat * 0.92, 'square', 0.11);
        playNote(ctx, freq / 2, t, beats * beat * 0.9, 'triangle', 0.06);
        t += beats * beat;
      });

      lyrics.hidden = false;
      let line = 0;
      lyrics.textContent = THEME_LINES[0];
      const iv = setInterval(() => {
        line += 1;
        if (line >= THEME_LINES.length) { clearInterval(iv); return; }
        lyrics.textContent = THEME_LINES[line];
      }, 1400);

      setTimeout(() => {
        themePlaying = false;
        btn.classList.remove('playing');
        lyrics.hidden = true;
        lyrics.textContent = '';
      }, (t - t0) * 1000 + 200);
    }

    document.getElementById('padCancel').addEventListener('pointerup', (e) => {
      e.preventDefault();
      closePad();
    });
    document.getElementById('padOverlay').addEventListener('pointerup', (e) => {
      if (e.target.id === 'padOverlay') closePad();
    });
    document.getElementById('settingsBtn').addEventListener('pointerup', (e) => {
      e.preventDefault();
      document.getElementById('resetOverlay').classList.add('open');
    });
    document.getElementById('resetCancel').addEventListener('pointerup', (e) => {
      e.preventDefault();
      document.getElementById('resetOverlay').classList.remove('open');
    });
    document.getElementById('resetConfirm').addEventListener('pointerup', (e) => {
      e.preventDefault();
      document.getElementById('resetOverlay').classList.remove('open');
      resetScores();
    });
    document.getElementById('sortBtn').addEventListener('pointerup', (e) => {
      e.preventDefault();
      sortByScore = !sortByScore;
      try { localStorage.setItem('flip7_sort_by_score', sortByScore ? '1' : '0'); } catch (_) {}
      render();
    });
    document.getElementById('themeBtn').addEventListener('pointerup', (e) => {
      e.preventDefault();
      playTheme();
    });
    document.getElementById('recapBtn').addEventListener('pointerup', (e) => {
      e.preventDefault();
      openRecap();
    });
    document.getElementById('recapClose').addEventListener('pointerup', (e) => {
      e.preventDefault();
      closeRecap();
    });
    document.getElementById('recapLock').addEventListener('pointerup', (e) => {
      e.preventDefault();
      endRound();
    });
    document.getElementById('recapOverlay').addEventListener('pointerup', (e) => {
      if (e.target.id === 'recapOverlay') closeRecap();
    });

    buildPad();
    loadAll();
    saveScores();
    saveMeta();
    updateHint();
    render();
  </script>
</body>
</html>
